[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hopper-mini"
version = "0.1.0"
description = "A laptop-scale trace store for AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "duckdb>=2.0",
    "googleapis-common-protos",
    "opentelemetry-proto",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "protobuf",
    "pyarrow",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pytz",
    "typer>=0.15",
    "pillow==12.0.0",
]

[project.scripts]
hopper = "hopper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hopper"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
