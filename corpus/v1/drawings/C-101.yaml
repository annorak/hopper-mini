{
  "id": "C-101",
  "title": "Civil plan, pressure-main trench, and restoration",
  "notes": [
    {
      "number": 1,
      "text": "Bedding under the pressure main shall be excavated native soil. Shape the bedding under the full pipe barrel before making the joints."
    },
    {
      "number": 2,
      "text": "The surveyed pressure-main trench length is 85 m. The length follows the pipe centerline between the wet-well wall and the connection chamber."
    },
    {
      "number": 3,
      "text": "The walkway restoration area is 45 m2. Match the retained door threshold and provide a slip-resistant finish."
    },
    {
      "number": 4,
      "text": "Retain the storm catch basin and keep sediment out of its inlet. The pressure-main trench does not alter the basin discharge connection."
    },
    {
      "number": 5,
      "text": "Plate the access-route crossing whenever an open trench would prevent an owner maintenance vehicle from reaching the control room."
    },
    {
      "number": 6,
      "text": "Hold the east-gate pavement tie-in pending the engineer of record finished-grade decision. Survey the retained road edge before requesting that decision."
    }
  ]
}
